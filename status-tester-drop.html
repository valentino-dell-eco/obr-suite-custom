<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Status drop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#e6e8ee}
.blocker{position:fixed;inset:0;background:rgba(7,12,24,0.12);cursor:grabbing;user-select:none;touch-action:none}
.target{position:absolute;border:2px dashed rgba(255,255,255,0.45);border-radius:50%;pointer-events:none;
  transition:border-color .08s,box-shadow .08s,background .08s}
.target.hot{border:3px solid var(--c,#5dade2);background:color-mix(in srgb,var(--c,#5dade2) 18%,transparent);
  box-shadow:0 0 0 2px rgba(7,12,24,0.55),0 0 18px var(--c,#5dade2)}
.ghost{position:absolute;left:-1000px;top:-1000px;opacity:0;transition:opacity .1s;display:inline-flex;align-items:center;gap:6px;height:28px;
  padding:0 12px 0 9px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap;pointer-events:none;
  border:1px solid rgba(0,0,0,.35);box-shadow:0 6px 18px rgba(0,0,0,0.45);transform:translate(14px,10px)}
.ghost.on{opacity:.62}
.ghost img{width:16px;height:16px;flex:none}
.ghost .emoji{font-size:15px;line-height:1}
.ghost .tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,0.35);color:#fff}
.ghost .tag[hidden]{display:none}
.banner{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;
  background:rgba(15,20,36,0.92);border:1px solid rgba(255,255,255,0.14);font-size:12px;font-weight:600;
  pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div class="blocker" id="blocker"></div>
<div id="targets"></div>
<div class="ghost" id="ghost"></div>
<div class="banner" id="banner"></div>
<script type="module" src="/src/status-tester-drop-page.ts"></script>
</body>
</html>
