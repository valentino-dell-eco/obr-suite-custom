<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chase Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(15, 20, 36, 0.94);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: #e6e8ee;
      }

      /* Layout sticky-footer: header + body flessibile + editor sempre in fondo */
      .dock {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .dock-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
        font-weight: 800;
        flex: none;
        user-select: none;
      }
      .drag-handle {
        flex-shrink: 0;
        width: 14px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        color: rgba(255, 255, 255, 0.3);
        opacity: 0.55;
        transition:
          opacity 0.12s,
          color 0.12s;
        touch-action: none;
        user-select: none;
      }
      .drag-handle:hover {
        opacity: 1;
        color: rgba(255, 255, 255, 0.85);
      }
      .drag-handle.is-dragging {
        cursor: grabbing;
        opacity: 1;
        color: #5dade2;
      }
      .drag-handle svg {
        width: 12px;
        height: 18px;
        display: block;
        pointer-events: none;
      }

      /* Wrapper che prende TUTTO lo spazio verticale disponibile.
   min-height:0 è necessario in flexbox per permettere lo shrink. */
      .body-wrap {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dock-body {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        padding: 5px 12px 10px; /* 5px in alto = gap reale dall'header */
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-snap-type: y mandatory;
        /* Deve combaciare col padding-top, altrimenti lo snap riallinea
     la chase al bordo del container ignorando il padding. */
        scroll-padding-top: 5px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .dock-body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .chase-indicator {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: none;
        z-index: 5;
      }
      .chase-indicator.hidden {
        display: none;
      }

      .chase-counter {
        margin-left: auto;
        font-size: 10px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: #e6e8ee;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        padding: 1px 6px;
        line-height: 1.4;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      .chase-counter.hidden {
        display: none;
      }

      /* Stack verticale dei pallini */
      .chase-dots {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chase-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        transition:
          background 0.18s ease,
          transform 0.18s ease;
      }
      .chase-dot.active {
        background: #3498db;
        transform: scale(1.6);
      }

      .chase {
        border: 1px dashed rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        flex: none;
        overflow: hidden;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      .chase-main {
        flex: 1;
        min-width: 0;
        padding: 3px 10px 6px; /* era: 6px 10px */
        display: flex;
        flex-direction: column;
      }
      .chase-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chase-title {
        font-size: 12px;
        font-weight: 700;
        color: #e6e8ee;
      }
      .chase-gap {
        font-size: 11px;
        color: #9aa0b3;
        margin-left: auto;
      }
      .chase-del {
        flex: none;
        width: 38px;
        align-self: stretch;
        display: flex;
        align-items: center;
        justify-content: center;
        border-left: 1px solid rgba(231, 76, 60, 0.35);
        background: rgba(231, 76, 60, 0.1);
        color: rgba(255, 150, 138, 0.6);
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease,
          box-shadow 0.12s ease;
      }
      .chase-del:hover {
        background: rgba(231, 76, 60, 0.3);
        color: #ff8b7a;
        box-shadow: inset 0 0 0 1px rgba(231, 76, 60, 0.5);
      }
      .chase-del svg {
        width: 16px;
        height: 16px;
        pointer-events: none;
      }
      .track-wrap {
        position: relative;
        height: 26px; /* era 32px */
        margin-top: 10px; /* era 16px */
      }
      .track {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 50%;
        height: 4px;
        transform: translateY(-50%);
        border-radius: 2px;
        background: linear-gradient(90deg, #e74c3c, #3498db);
      }
      /* Container del pin: dimensioni + posizione, NESSUN clip/border-radius.
   Il cerchio vero è disegnato dal ::after, l'anello dagli shadow. */
      .pin {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 24px;
        height: 24px;
        cursor: pointer;
        /* nessun border-radius/clip-path qui: servono al ::after */
      }

      /* Cerchio immagine: eredita il background-image impostato via JS
   su .pin, lo clippa in cerchio e disegna il bordo del ruolo. */
      .pin::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        box-sizing: border-box;
        border: 2px solid #14182a;
        background-image: inherit; /* eredita da .pin (inline style) */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .pin.quarry::after {
        border-color: #3498db;
      }
      .pin.pursuer::after {
        border-color: #e74c3c;
      }

      /* Highlight: applicato al ::after, quindi NON viene tagliato. */
      .pin.selected::after {
        box-shadow:
          0 0 0 3px rgba(255, 255, 255, 0.8),
          0 2px 8px rgba(0, 0, 0, 0.6);
      }
      .pin.active-turn::after {
        box-shadow:
          0 0 0 3px #f5c876,
          0 0 10px 2px rgba(245, 200, 118, 0.8);
      }
      .pin-label {
        position: absolute;
        top: -13px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 700;
        color: #e6e8ee;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      .empty-hint {
        font-size: 11px;
        color: #9aa0b3;
        text-align: center;
        padding: 4px 0;
      }

      /* Footer SEMPRE visibile, ancorato in fondo (flex:none). */
      .editor {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(8, 11, 20, 0.65);
      }
      .editor.disabled .editor-name,
      .editor.disabled .editor-step,
      .editor.disabled .editor-input,
      .editor.disabled .editor-confirm,
      .editor.disabled .editor-cancel {
        opacity: 0.45;
        pointer-events: none;
      }
      .editor-name {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        font-weight: 700;
        color: #e6e8ee;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .editor.disabled .editor-name {
        font-style: italic;
        font-weight: 500;
        color: #9aa0b3;
      }
      .editor-step {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #e6e8ee;
        font-size: 15px;
        font-weight: 800;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
      }
      .editor-step:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .editor-input {
        flex: none;
        width: 60px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 7px;
        color: #e6e8ee;
        padding: 5px 2px;
      }
      .editor-input::-webkit-outer-spin-button,
      .editor-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .editor-confirm,
      .editor-cancel {
        flex: none;
        font-size: 11.5px;
        font-weight: 700;
        border: none;
        border-radius: 7px;
        padding: 7px 12px;
        cursor: pointer;
      }
      .editor-confirm {
        background: #3498db;
        color: #fff;
      }
      .editor-confirm:hover {
        background: #4aa8e8;
      }
      .editor-confirm:disabled {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.35);
        cursor: default;
      }
      .editor-cancel {
        background: rgba(231, 76, 60, 0.14);
        color: #ff8b7a;
      }
      .editor-cancel:hover {
        background: rgba(231, 76, 60, 0.26);
      }
    </style>
  </head>
  <body>
    <div class="dock">
      <div class="dock-head" id="dockHead">
        <div
          class="drag-handle"
          id="dragHandle"
          title="Drag to reposition"
          aria-label="Drag to reposition"
        >
          <svg viewBox="0 0 12 18" aria-hidden="true">
            <circle cx="3" cy="3" r="1.2" fill="currentColor" />
            <circle cx="9" cy="3" r="1.2" fill="currentColor" />
            <circle cx="3" cy="9" r="1.2" fill="currentColor" />
            <circle cx="9" cy="9" r="1.2" fill="currentColor" />
            <circle cx="3" cy="15" r="1.2" fill="currentColor" />
            <circle cx="9" cy="15" r="1.2" fill="currentColor" />
          </svg>
        </div>
        <span id="dockTitle">Chase Tracker</span>
        <span class="chase-counter hidden" id="chaseCounter">1 / 1</span>
      </div>

      <div class="body-wrap">
        <div class="dock-body" id="body"></div>
        <div class="chase-indicator hidden" id="chaseIndicator"></div>
      </div>

      <div class="editor disabled" id="editor">
        <div class="editor-name" id="editorName">—</div>
        <div class="editor-step" id="editorDec">−</div>
        <input
          type="number"
          class="editor-input"
          id="editorInput"
          step="1"
          min="0"
          disabled
        />
        <div class="editor-step" id="editorInc">+</div>
        <button class="editor-cancel" id="editorCancel" disabled>Cancel</button>
        <button class="editor-confirm" id="editorConfirm" disabled>
          Confirm
        </button>
      </div>
    </div>
    <script type="module" src="/src/chase-tracker-page.ts"></script>
  </body>
</html>
