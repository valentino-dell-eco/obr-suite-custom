<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hit dice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;width:100%;overflow:hidden;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#e6e8ee;
}
.card{
  height:100%;display:flex;flex-direction:column;
  background:rgba(15,20,36,0.97);border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;overflow:hidden;
}
.head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.08)}
.head .title{flex:1;min-width:0;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9aa0b3}
.close{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);cursor:pointer;font-weight:800}
.close:hover{background:rgba(255,255,255,0.1);color:#fff}
.body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.box{padding:9px 11px;border-radius:9px;background:rgba(76,195,138,0.10);border:1px solid rgba(76,195,138,0.38)}
.box .name{font-size:14px;font-weight:800;color:#c9f5df}
.box .sub{margin-top:3px;font-size:11px;color:#9aa0b3}
.intro{font-size:12.5px;line-height:1.45;color:#dde1ec}
.field{display:flex;flex-direction:column;gap:5px}
.field .lbl{font-size:11px;color:#9aa0b3}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,0.18);background:#1a2036;color:#e6e8ee;font-size:16px;font-weight:800;cursor:pointer}
.stepper button:hover{border-color:#4cc38a}
.stepper input{flex:1;min-width:0;font-size:14px;padding:6px 10px;border-radius:8px;background:#1a2036;border:1px solid rgba(255,255,255,0.18);color:#e6e8ee;outline:none;text-align:center}
.stepper input:focus{border-color:#4cc38a}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* Firefox: no spinner either (− / + and the arrow keys still step). */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.pool{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.10);margin-bottom:6px}
.pool .die{flex:0 0 44px;font-size:14px;font-weight:800;color:#c9f5df}
.pool .left{flex:1;font-size:11px;color:#9aa0b3}
.pool .stepper{flex:none}
.pool .stepper input{width:48px;flex:none}
.result{font-size:12.5px;color:#7fd8b0;font-weight:600;line-height:1.4}
.note{font-size:11px;color:#9aa0b3;font-style:italic}
.foot{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,0.08)}
.secret{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;color:#c9b6ff;cursor:pointer;user-select:none;margin-right:auto}
.secret input{accent-color:#9b6bff;width:14px;height:14px;margin:0;cursor:pointer}
button.btn{font-size:12px;font-weight:700;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
.done{background:rgba(255,255,255,0.08);color:#c5cad8}
.done:hover{background:rgba(255,255,255,0.16)}
.roll{background:#2f9e6a;color:#fff}
.roll:hover{background:#38b47a}
button:disabled{opacity:.5;cursor:default}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title" id="title"></span>
    <div class="close" id="close">✕</div>
  </div>
  <div class="body">
    <div class="box">
      <div class="name" id="name"></div>
      <div class="sub" id="sub"></div>
    </div>
    <p class="intro" id="intro"></p>
    <div class="field" id="countField">
      <div class="lbl" id="countLbl"></div>
      <div id="pools"></div>
    </div>
    <div class="result hidden" id="result"></div>
    <div class="note hidden" id="note"></div>
  </div>
  <div class="foot">
    <label class="secret" id="secretWrap"><input type="checkbox" id="secret"><span id="secretLbl"></span></label>
    <button class="btn done" id="done"></button>
    <button class="btn roll" id="roll"></button>
  </div>
</div>
<script type="module" src="/src/hit-dice-page.ts"></script>
</body>
</html>
