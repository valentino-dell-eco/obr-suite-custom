<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>角色卡信息</title>
    <style>
      /* No transitions / animations anywhere — user wants instant 0-frame show/hide. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: none !important;
        animation: none !important;
      }

      /* Popover is only open while a bound character is selected, so the iframe
   never occupies screen space when no card is shown — the block-clicks
   problem is avoided entirely by simply not existing. */
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: #eee;
        background: transparent;
      }

      .card {
        position: absolute;
        inset: 0;
        background: rgba(22, 33, 62, 0.94);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      /* Drag grip — sits inline inside .hdr before the character name.
   Participates in the flex header layout. */
      .drag-handle {
        flex-shrink: 0;
        width: 14px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        color: rgba(255, 255, 255, 0.3);
        opacity: 0.55;
        transition:
          opacity 0.12s,
          color 0.12s;
        touch-action: none;
        user-select: none;
      }
      .drag-handle:hover {
        opacity: 1;
        color: rgba(255, 255, 255, 0.85);
      }
      .drag-handle.is-dragging {
        cursor: grabbing;
        opacity: 1;
        color: #5dade2;
      }
      .drag-handle svg {
        width: 12px;
        height: 18px;
        display: block;
        pointer-events: none;
      }
      /* Pin button — toggles "panel doesn't auto-close on deselect". */
      .panel-pin-btn {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.3);
        opacity: 0.55;
        transition:
          opacity 0.12s,
          color 0.12s,
          transform 0.15s;
        border-radius: 3px;
      }
      .panel-pin-btn:hover {
        opacity: 1;
        color: rgba(255, 255, 255, 0.85);
      }
      .panel-pin-btn.pinned {
        opacity: 1;
        color: #f5a623;
        transform: rotate(-25deg);
      }
      .panel-pin-btn.pinned:hover {
        color: #ffc857;
      }
      .panel-pin-btn svg {
        width: 14px;
        height: 14px;
        display: block;
        pointer-events: none;
      }
      /* 2026-05-11 — reset button (mirror of monster-info). LOCAL broadcast
   tells the bubbles bg to drop the cached entry for the bound token
   and re-render. Fixes occasional "blood bar drifted off-anchor". */
      .reset-btn {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.3);
        opacity: 0.55;
        transition:
          opacity 0.12s,
          color 0.12s,
          transform 0.25s;
        border-radius: 3px;
      }
      .reset-btn:hover {
        opacity: 1;
        color: #f5a623;
      }
      .reset-btn:active {
        transform: rotate(180deg);
      }
      .reset-btn.flash {
        opacity: 1;
        color: #f5a623;
        transform: rotate(180deg);
      }
      .reset-btn svg {
        width: 13px;
        height: 13px;
        display: block;
        pointer-events: none;
      }
      /* Sync status (cloud) + refresh — mirrors cc-panel sidebar. */
      .sync-wrap {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .cc-cloud,
      .cc-refresh {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: default;
        opacity: 0.75;
        border-radius: 3px;
        transition:
          opacity 0.12s,
          background 0.12s,
          color 0.12s;
      }
      .cc-cloud svg,
      .cc-refresh svg {
        width: 13px;
        height: 13px;
        display: block;
        pointer-events: none;
      }
      .cc-cloud.is-synced {
        color: #2ecc71;
      }
      .cc-cloud.is-dirty {
        color: #f39c12;
        cursor: pointer;
        opacity: 1;
      }
      .cc-cloud.is-dirty:hover {
        background: rgba(243, 156, 18, 0.15);
        color: #f5b942;
      }
      .cc-cloud.is-local {
        color: #e74c3c;
        opacity: 1;
      }
      .cc-cloud.is-spinning {
        color: #7ab8e8;
        opacity: 1;
        pointer-events: none;
      }
      .cc-refresh {
        color: #7be0a0;
        cursor: pointer;
      }
      .cc-refresh:hover {
        background: rgba(46, 204, 113, 0.18);
        opacity: 1;
      }
      .cc-refresh:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .cc-refresh.spinning {
        opacity: 1;
        pointer-events: none;
      }
      .cc-cloud.is-spinning svg,
      .cc-refresh.spinning svg {
        animation: cc-info-spin 0.8s linear infinite !important;
      }
      @keyframes cc-info-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 2026-05-12 — scrollbar hidden (still scrollable via wheel/touch).
   The 3px scrollbar was causing width jumps on tab switch that
   stretched sibling components. */
      .root {
        padding: 10px 12px;
        height: 100%;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        zoom: var(--panel-zoom, 1);
      }
      .root::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .hdr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 7px;
      }
      .name {
        font-size: 14px;
        font-weight: 700;
        color: #f5a623;
        flex-shrink: 0;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 2026-07 — wraps name-wrap + sub as a unit. At normal widths both
   sit on one row ("Flint  Human/Elf Rogue Lv4"); when .hdr doesn't have
   room for both plus the icons/Raw Data on either side, .sub (having
   its own minimum width below) drops to a second row on its own,
   getting the FULL width instead of being ellipsis-truncated into
   illegibility. No breakpoint to pick — this is native flex-wrap
   reflow, so it adapts to whatever width the panel actually ends up at. */
      .title-block {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 6px;
        row-gap: 0;
        flex: 1 1 auto;
        min-width: 0;
      }
      .name-wrap {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        flex-shrink: 0;
      }
      /* When the card is bound to a scene token, the name renders as a
   button so clicking it syncs/clears the token's plainText label.
   Keeps the same visual size as the static .name div but adds a
   subtle hover halo + cursor: pointer to advertise click affordance. */
      button.name.name-btn {
        appearance: none;
        border: none;
        background: transparent;
        font-family: inherit;
        text-align: left;
        padding: 0;
        margin: 0;
        cursor: pointer;
        border-radius: 4px;
        transition:
          background 0.12s,
          color 0.12s,
          text-shadow 0.12s;
      }
      button.name.name-btn:hover {
        background: rgba(245, 166, 35, 0.14);
        color: #ffd27a;
        text-shadow: 0 0 6px rgba(245, 166, 35, 0.45);
      }
      button.name.name-btn:active {
        transform: scale(0.97);
      }
      button.name.name-btn:focus-visible {
        outline: 1px dashed rgba(245, 166, 35, 0.65);
        outline-offset: 2px;
      }
      button.name.name-btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .sub {
        font-size: 10.5px;
        color: #aaa;
        /* flex-basis 140px = "wants at least this much before agreeing
           to share a row with the name" — below that, flex-wrap on
           .title-block (above) bumps it to its own full-width row. */
        flex: 1 1 140px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .raw-link {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #5dade2;
        text-decoration: none;
        padding: 2px 7px;
        border: 1px solid rgba(93, 173, 226, 0.4);
        border-radius: 10px;
        background: rgba(52, 152, 219, 0.1);
        white-space: nowrap;
      }
      .raw-link:hover {
        background: rgba(52, 152, 219, 0.25);
        color: #fff;
      }

      /* === HP / Temp / AC stat banner host ========================
   The banner itself (.stat-banner + its hp-pill / temp-pill /
   ac-pill / stat-input / stat-lock children) is the shared
   `mountStatBanner` component — the SAME one the standalone DM
   resource tracker mounts. It injects ALL of its own CSS at
   runtime (src/utils/statBanner.ts), so cc-info no longer carries
   a copy — this used to be ~175 lines of byte-identical duplicate.
   This host element only carries the cc-info-specific chrome:
   sticky-to-scroll-top + the opaque wash that keeps scrolling
   content from showing through the translucent card backdrop. */
      .cc-stat-mount {
        position: sticky;
        top: -10px;
        z-index: 20;
        margin: 0 0 8px;
        background: rgba(22, 33, 62, 0.94);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        margin-bottom: 6px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 4px;
        padding: 3px 4px;
        text-align: center;
      }
      .chip .k {
        font-size: 8.5px;
        color: #888;
        letter-spacing: 0.3px;
        display: block;
        line-height: 1.2;
      }
      .chip .v {
        font-size: 12px;
        font-weight: 700;
        color: #eee;
        line-height: 1.25;
      }
      .chip.hp .v {
        color: #e94560;
      }
      .chip.ac .v {
        color: #3498db;
      }
      .chip.init .v {
        color: #2ecc71;
      }

      /* align-items: stretch (grid default) makes the cards in each row share
   the same height — short cards grow to match taller ones so the layout no
   longer looks ragged with short cards beside tall ones.
   2026-07 — was a hardcoded repeat(3, 1fr), which assumed short CJK skill
   labels (运动 +5). English labels (Animal Handling, Investigation) don't
   fit 3-per-row at narrow panel widths and collide/overlap. auto-fit +
   minmax lets the grid drop to 2 or 1 columns on its own as the panel
   narrows, with whichever count DOES fit getting the full row width
   (rather than 3 cramped columns no matter what). */
      .abil {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
        gap: 3px;
        margin-bottom: 6px;
        align-items: stretch;
      }
      .abl {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 4px;
        padding: 3px 5px;
        display: flex;
        flex-direction: column;
        /* Same min-width:0 reasoning as .sk below — lets .abil's
           auto-fit/minmax() tracks actually shrink instead of expanding
           to fit this card's untruncated content. */
        min-width: 0;
      }
      .abl-head {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .abl-head .a {
        font-size: 9px;
        color: #888;
        font-weight: 700;
        letter-spacing: 0.5px;
        width: 14px;
      }
      .abl-head .t {
        font-size: 11px;
        color: #bbb;
        min-width: 16px;
      }
      .abl-head .m {
        margin-left: auto;
        font-size: 11.5px;
        color: #f5a623;
        font-weight: 700;
      }
      .abl.prof {
        background: rgba(245, 166, 35, 0.14);
        border-color: rgba(245, 166, 35, 0.55);
      }
      .abl.prof .abl-head .a {
        color: #f5a623;
      }
      .abl.prof .abl-head .t {
        color: #fce6bd;
      }

      /* Skills embedded inside each ability card — auto-fit chips instead of
   a hardcoded 2-column grid. A short CJK label ("运动 +5") still fits two
   per row; a long English one ("Animal Handling +3") drops to one per
   row on its own once the card is too narrow for two, instead of
   wrapping and colliding with its neighbour. */
      .abl-skills {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
        gap: 1px 4px;
        margin-top: 3px;
        padding-top: 3px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        flex: 1;
        align-content: start;
      }
      .abl .sk {
        display: flex;
        align-items: baseline;
        gap: 3px;
        padding: 0 2px;
        font-size: 9.5px;
        line-height: 1.4;
        border-radius: 2px;
        /* Grid items default to min-width:auto (respects content's
           intrinsic size), which fights the auto-fit/minmax() track
           sizing above and was the actual cause of the collision — the
           track would rather overflow than shrink below "Investigation"'s
           natural width. This lets .sk-n's own text-overflow:ellipsis
           (below) do its job instead. */
        min-width: 0;
      }
      .abl .sk .sk-n {
        color: #888;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .abl .sk .sk-v {
        color: #888;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }
      .abl .sk.sk-prof {
        background: rgba(245, 166, 35, 0.1);
      }
      .abl .sk.sk-prof .sk-n {
        color: #fce6bd;
      }
      .abl .sk.sk-prof .sk-v {
        color: #f5a623;
      }
      .abl .sk.sk-exp {
        background: rgba(46, 204, 113, 0.12);
      }
      .abl .sk.sk-exp .sk-n {
        color: #abf3c7;
      }
      .abl .sk.sk-exp .sk-v {
        color: #2ecc71;
      }

      .sect {
        font-size: 9.5px;
        color: #5dade2;
        letter-spacing: 0.6px;
        margin: 5px 0 3px;
        font-weight: 600;
      }

      .wp {
        display: grid;
        grid-template-columns: 8fr 4fr; /* Rapporto 8 a 4 richiesto */
        gap: 6px;
        align-items: start;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.035);
        border-radius: 4px;
        margin-bottom: 3px;
        font-size: 11px;
      }
      .wp.spell {
        background: rgba(155, 89, 182, 0.14);
        border: 1px solid rgba(155, 89, 182, 0.35);
      }
      .wp.spell .n {
        color: #d8b4ff;
      }
      .wp .n {
        color: #eee;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .wp .atk {
        color: #2ecc71;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .wp .dmg {
        color: #ccc;
        font-variant-numeric: tabular-nums;
      }

      /* Nuove classi strutturali per la Grid 8:4 */
      .wp-left {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .wp-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
        gap: 3px;
      }
      .wp-main-atk-dmg {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      /* Adattamento stili preesistenti */
      .wp .prop-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 1px;
      }
      .wp .prop-chip {
        display: inline-block;
        padding: 1px 6px;
        font-size: 9.5px;
        line-height: 1.4;
        background: rgba(93, 173, 226, 0.1);
        border: 1px solid rgba(93, 173, 226, 0.28);
        border-radius: 8px;
        color: #9ad9ff;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s,
          color 0.12s;
      }
      .wp .prop-chip:hover {
        background: rgba(93, 173, 226, 0.22);
        border-color: rgba(93, 173, 226, 0.55);
        color: #cfeaff;
      }
      .wp .prop-chip.prop-mastery {
        background: rgba(245, 166, 35, 0.12);
        border-color: rgba(245, 166, 35, 0.4);
        color: #f5d076;
      }
      .wp .prop-chip.prop-mastery em {
        font-style: normal;
        font-size: 8px;
        font-weight: 700;
        margin-right: 3px;
        letter-spacing: 0.3px;
        color: rgba(245, 166, 35, 0.85);
      }
      .wp .prop-chip.prop-mastery:hover {
        background: rgba(245, 166, 35, 0.22);
        border-color: rgba(245, 166, 35, 0.65);
      }

      /* Extra damage rows */
      .wp .wp-extra-dmg {
        grid-column: 3 / -1;
        margin-top: 3px;
        padding: 3px 8px;
        background: rgba(255, 140, 80, 0.15);
        border: 1px solid rgba(255, 140, 80, 0.4);
        border-radius: 4px;
        font-size: 10.5px;
        color: #ffb088;
        cursor: pointer;
      }
      .wp .wp-extra-dmg:hover {
        background: rgba(255, 140, 80, 0.25);
        border-color: #ff8866;
        color: #ffe0cc;
      }

      .empty {
        color: #888;
        font-size: 11px;
        padding: 3px 6px;
      }
      .err {
        color: #e74c3c;
        padding: 12px;
        text-align: center;
        font-size: 11px;
      }
      .loading {
        color: #888;
        padding: 20px;
        text-align: center;
        font-size: 11px;
      }

      /* Rollable elements */
      .rollable {
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s,
          transform 0.08s;
        border-radius: 3px;
      }
      .rollable:hover {
        background: rgba(93, 173, 226, 0.18);
        color: #9bd0f0 !important;
      }
      .rollable:active {
        transform: scale(0.96);
      }
      .rollable.rollable-flash {
        animation: rollFlash 0.4s ease-out;
      }
      @keyframes rollFlash {
        0% {
          background: rgba(93, 173, 226, 0.55);
          transform: scale(1.18);
        }
        100% {
          background: transparent;
          transform: scale(1);
        }
      }
      .abl .sk.rollable {
        cursor: pointer;
      }
      .abl .sk.rollable:hover {
        background: rgba(93, 173, 226, 0.18);
      }
      .wp .rollable {
        padding: 0 2px;
      }

      /* Spells, search, tabs... (i tuoi stili originali) */
      .sp-block {
        margin-bottom: 6px;
      }
      .sp-lvl {
        font-size: 9.5px;
        font-weight: 700;
        color: #9ab;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.04);
        border-left: 2px solid rgba(155, 89, 182, 0.55);
        border-radius: 0 4px 4px 0;
        margin-bottom: 3px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sp-lvl .sp-slot {
        font-family: ui-monospace, monospace;
        font-size: 9.5px;
        font-weight: 700;
        color: #cda9e8;
        background: rgba(155, 89, 182, 0.18);
        padding: 0 5px;
        border-radius: 3px;
      }
      .sp-items {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .sp-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 6px;
        align-items: center;
        padding: 3px 6px;
        background: rgba(255, 255, 255, 0.025);
        border-radius: 4px;
        font-size: 11px;
        min-height: 22px;
      }
      .sp-row:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .sp-row .sp-name {
        color: #eee;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .sp-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 4px;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.12s,
          color 0.12s,
          transform 0.08s;
        letter-spacing: 0.2px;
      }
      .sp-btn.sp-hit {
        color: #9be0a8;
        background: rgba(46, 204, 113, 0.16);
        border: 1px solid rgba(46, 204, 113, 0.4);
      }
      .sp-btn.sp-hit:hover {
        background: rgba(46, 204, 113, 0.28);
        color: #d2f5dd;
      }
      .sp-btn.sp-dmg {
        color: #ffb088;
        background: rgba(255, 140, 80, 0.14);
        border: 1px solid rgba(255, 140, 80, 0.4);
      }
      .sp-btn.sp-dmg:hover {
        background: rgba(255, 140, 80, 0.28);
        color: #ffd6c0;
      }
      .sp-btn:active {
        transform: scale(0.94);
      }
      .sp-btn.rollable-flash {
        animation: rollFlash 0.4s ease-out;
      }

      .srch-sect {
        margin-top: 6px;
      }
      .srch-sect-h {
        font-size: 9.5px;
        font-weight: 700;
        color: #9ab;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.04);
        border-left: 2px solid rgba(93, 173, 226, 0.55);
        border-radius: 0 4px 4px 0;
        margin-bottom: 3px;
      }
      .srch-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        padding: 0 2px;
      }
      .srch-chip {
        display: inline-block;
        padding: 1px 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        font-size: 10px;
        line-height: 1.4;
        font-weight: 600;
        color: #cdd2e0;
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s,
          transform 0.08s;
        white-space: nowrap;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .srch-chip:hover {
        background: rgba(93, 173, 226, 0.18);
        border-color: rgba(93, 173, 226, 0.5);
        color: #bfe2f5;
      }
      .srch-chip:active {
        transform: scale(0.96);
      }
      .srch-chip.srch-flash {
        animation: srchFlash 0.4s ease-out;
      }
      @keyframes srchFlash {
        0% {
          background: rgba(93, 173, 226, 0.55);
          transform: scale(1.1);
        }
        100% {
          background: rgba(255, 255, 255, 0.06);
          transform: scale(1);
        }
      }

      /* Per-card SR/LR/DW/DS recovery row — see info-page.ts
         renderRtTabStrip(). Sits directly above the attr/res tabs. */
      .cc-recovery-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 6px 8px;
        background: rgba(31, 33, 48, 0.94);
      }
      .cc-recovery-btn {
        background: rgba(147, 112, 219, 0.14);
        border: 1px solid rgba(147, 112, 219, 0.5);
        color: #c9a6f5;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        padding: 5px 0;
        border-radius: 5px;
      }
      .cc-recovery-btn:hover {
        background: rgba(147, 112, 219, 0.28);
        border-color: rgba(147, 112, 219, 0.8);
      }
      .cc-recovery-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .rt-tabstrip {
        position: sticky;
        top: 36px;
        z-index: 19;
        background: rgba(31, 33, 48, 0.94);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        gap: 0;
        padding: 0;
        margin: 0 -2px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .rt-tabstrip .rt-tab {
        flex: 1;
        height: 30px;
        background: transparent;
        border: none;
        color: #9aa0b3;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        user-select: none;
        position: relative;
        z-index: 1;
        transition: color 0.18s ease;
      }
      .rt-tabstrip .rt-tab:hover,
      .rt-tabstrip .rt-tab.on {
        color: #e6e8ee;
      }
      .rt-tab-indicator {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 30px;
        width: 0;
        background: rgba(93, 173, 226, 0.14);
        border-bottom: 2px solid #5dade2;
        border-radius: 4px 4px 0 0;
        transition:
          transform 0.1s ease-out,
          width 0.1s ease-out !important;
        pointer-events: none;
        z-index: 0;
      }
      .rt-clip {
        position: relative;
        overflow: hidden;
        width: 100%;
        display: grid;
        grid-template-columns: 100%;
        contain: layout paint;
      }
      .rt-pane {
        grid-area: 1 / 1;
        width: 100%;
        transition:
          transform 0.1s ease-out,
          opacity 0.1s ease-out !important;
      }
      .rt-clip[data-active="attr"] .rt-pane[data-pane="attr"] {
        transform: translateX(0);
        opacity: 1;
      }
      .rt-clip[data-active="attr"] .rt-pane[data-pane="res"] {
        transform: translateX(100%);
        opacity: 0.4;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .rt-clip[data-active="res"] .rt-pane[data-pane="attr"] {
        transform: translateX(-100%);
        opacity: 0.4;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .rt-clip[data-active="res"] .rt-pane[data-pane="res"] {
        transform: translateX(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="root" id="root"></div>
    </div>
    <script
      type="module"
      src="/src/modules/characterCards/info-page.ts"
    ></script>
  </body>
</html>
