<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit name tag</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#e6e8ee}
.card{height:100%;display:flex;flex-direction:column;background:rgba(15,20,36,0.97);
  border:1px solid rgba(255,255,255,0.14);border-radius:14px;overflow:hidden}
.head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.08)}
.head .title{flex:1;min-width:0;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9aa0b3}
.close{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.5);cursor:pointer;font-weight:800}
.close:hover{background:rgba(255,255,255,0.1);color:#fff}
.body{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.preview{align-self:center;min-width:150px;max-width:100%;padding:5px 18px;border-radius:8px 8px 4px 4px;
  font-family:Roboto,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:15px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 100%,0 100%)}
.row{display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;color:#9aa0b3;margin-bottom:-6px}
.name{width:100%;font-size:13px;padding:7px 9px;border-radius:6px;background:#1a2036;border:1px solid rgba(255,255,255,0.18);
  color:#e6e8ee;outline:none}
.name:focus,.hex:focus{border-color:#5dade2}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid rgba(255,255,255,0.15);cursor:pointer}
.sw.on{border-color:#fff}
input[type=color]{width:44px;height:30px;border:1px solid rgba(255,255,255,0.18);border-radius:6px;background:#1a2036;cursor:pointer;padding:2px}
.hex{flex:1;min-width:0;font-size:12px;padding:6px 8px;border-radius:6px;background:#1a2036;border:1px solid rgba(255,255,255,0.18);
  color:#e6e8ee;outline:none;font-family:ui-monospace,Consolas,monospace}
.foot{flex:none;display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,0.08)}
.foot .reset{margin-right:auto}
button.btn{font-size:12px;font-weight:700;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.reset,.btn.cancel{background:rgba(255,255,255,0.08);color:#c8ccd8}
.btn.apply{background:#2f7fd0;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title" id="title"></span>
    <div class="close" id="close">✕</div>
  </div>
  <div class="body">
    <div class="preview" id="preview"></div>
    <div class="lbl" id="nameLbl"></div>
    <input type="text" class="name" id="name" maxlength="60" spellcheck="false" autocomplete="off">
    <div class="lbl" id="colorLbl"></div>
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <input type="color" id="picker">
      <input type="text" class="hex" id="hex" maxlength="7" spellcheck="false">
    </div>
  </div>
  <div class="foot">
    <button class="btn reset" id="reset"></button>
    <button class="btn cancel" id="cancel"></button>
    <button class="btn apply" id="apply"></button>
  </div>
</div>
<script type="module" src="/src/name-color-page.ts"></script>
</body>
</html>
