<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suite menu</title>
  <style>
    /* Match Owlbear Rodeo native chrome:
       toolbar gray, soft elevation, purple hover accent, dense rows */
    :root {
      --obr-surface: #2c2e33;
      --obr-surface-elevated: #34363c;
      --obr-border: rgba(255, 255, 255, 0.08);
      --obr-text: rgba(255, 255, 255, 0.92);
      --obr-text-muted: rgba(255, 255, 255, 0.55);
      --obr-hover: rgba(255, 255, 255, 0.06);
      --obr-active: rgba(156, 124, 255, 0.18);
      --obr-accent: #9c7cff;
      --obr-radius: 12px;
      --obr-row-h: 40px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      height: 100%;
      padding: 4px;
    }
    .panel {
      height: 100%;
      background: var(--obr-surface);
      border: 1px solid var(--obr-border);
      border-radius: var(--obr-radius);
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .title {
      flex: 0 0 auto;
      padding: 10px 14px 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--obr-text-muted);
      user-select: none;
    }
    .list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 2px 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    button.row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: var(--obr-row-h);
      border: 0;
      background: transparent;
      color: var(--obr-text);
      text-align: left;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
      transition: background 0.1s ease;
    }
    button.row:hover,
    button.row:focus-visible {
      background: var(--obr-hover);
      outline: none;
    }
    button.row:active {
      background: var(--obr-active);
    }
    .ico-wrap {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
    }
    .ico {
      width: 18px;
      height: 18px;
      object-fit: contain;
      /* OBR toolbar icons are light-on-dark */
      filter: brightness(0) invert(1);
      opacity: 0.88;
    }
    button.row:hover .ico {
      opacity: 1;
    }
    .text {
      flex: 1 1 auto;
      min-width: 0;
    }
    .label {
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      font-size: 11px;
      color: var(--obr-text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      padding: 18px 12px;
      color: var(--obr-text-muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="panel">
      <div class="title" id="title">Tools</div>
      <div class="list" id="list">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/modules/toolsSuite/menu-page.ts"></script>
</body>
</html>
