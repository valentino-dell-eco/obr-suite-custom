<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cast spell / use feature</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;width:100%;overflow:hidden;background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#e6e8ee;
}
.card{
  height:100%;display:flex;flex-direction:column;
  background:rgba(15,20,36,0.97);border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;overflow:hidden;
}
.head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.08)}
.head .title{flex:1;min-width:0;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9aa0b3}
.spellbox{padding:9px 11px;border-radius:9px;background:rgba(156,124,255,0.12);border:1px solid rgba(156,124,255,0.35)}
.spellname{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:800;color:#e9e0ff}
.spellname .lvl{margin-left:auto;font-size:11px;font-weight:600;color:#b9c3d9}
.intro{font-size:12.5px;line-height:1.45;color:#dde1ec}
.intro b{color:#e9e0ff}
.note{font-size:11px;color:#9aa0b3;font-style:italic}
.close{flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5);cursor:pointer;font-weight:800}
.close:hover{background:rgba(255,255,255,0.1);color:#fff}
.meta{margin-top:4px;font-size:11px;color:#9aa0b3;font-style:italic;min-height:14px}
.body{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field .lbl{font-size:11px;color:#9aa0b3}
.field .lbl .edited{color:#f5c876;font-weight:700}
select,input{
  width:100%;font-size:13px;padding:7px 10px;border-radius:8px;
  background:#1a2036;border:1px solid rgba(255,255,255,0.18);color:#e6e8ee;outline:none;
}
select:focus,input:focus{border-color:#5dade2}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.foot{flex:none;display:flex;justify-content:flex-end;gap:8px;padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,0.08)}
.secret{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;color:#c9b6ff;cursor:pointer;user-select:none;margin-right:auto}
.secret input{accent-color:#9b6bff;width:14px;height:14px;margin:0;cursor:pointer}
button.btn{font-size:12px;font-weight:700;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
.cancel{background:rgba(255,255,255,0.08);color:#c5cad8}
.cancel:hover{background:rgba(255,255,255,0.16)}
.cast{background:#7c5cff;color:#fff}
.cast:hover{background:#8f74ff}
button:disabled{opacity:.5;cursor:default}
.resrow{display:flex;gap:6px}
.resrow select{flex:1;min-width:0}
.resrow input{flex:0 0 72px;text-align:center}
.featbox{background:rgba(245,166,35,0.10);border-color:rgba(245,166,35,0.38)}
.featbox .spellname{color:#ffe2b0}
.desc{margin-top:6px;font-size:11.5px;line-height:1.4;color:#c9cedb;white-space:pre-wrap;max-height:96px;overflow-y:auto}
.cast.use{background:#d98a1f}
.cast.use:hover{background:#e89a2f}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="title" id="title"></span>
    <div class="close" id="close">✕</div>
  </div>
  <div class="body">
    <div class="spellbox" id="box">
      <div class="spellname"><span id="name"></span><span class="lvl" id="lvl"></span></div>
      <div class="meta" id="meta"></div>
      <div class="desc hidden" id="desc"></div>
    </div>
    <p class="intro" id="intro"></p>
    <div class="field hidden" id="resField">
      <div class="lbl" id="resLbl"></div>
      <select id="res"></select>
      <div id="resVisual"></div>
      <div class="note hidden" id="resNote"></div>
    </div>
    <div class="field hidden" id="slotField">
      <div class="lbl" id="slotLbl"></div>
      <select id="slot"></select>
      <div id="slotVisual"></div>
      <div class="note hidden" id="slotNote"></div>
    </div>
    <div class="field" id="levelField">
      <div class="lbl" id="levelLbl"></div>
      <select id="level"></select>
    </div>
    <div class="field" id="dcField">
      <div class="lbl" id="dcLbl"></div>
      <input id="dc" type="number">
      <div class="note hidden" id="dcNote"></div>
    </div>
  </div>
  <div class="foot">
    <label class="secret" id="secretWrap"><input type="checkbox" id="secret"><span id="secretLbl"></span></label>
    <button class="btn cancel" id="cancel"></button>
    <button class="btn cast" id="cast"></button>
  </div>
</div>
<script type="module" src="/src/spell-cast-page.ts"></script>
</body>
</html>
