<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>Dice Quick Roll</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: rgba(31, 34, 48, 0.97);
        --bg-strong: #2c3044;
        --bg-card: #262a3a;
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #e6e8ee;
        --text-dim: #8a8e9c;
        --accent: #5dade2;
        --good: #7be0a0;
        --bad: #ff8b7a;
        --crit: #ffb74d;
        --dark: #bb87dd;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: var(--text);
        font-size: 12px;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .popup {
        position: relative;
        width: min(340px, 94vw);
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 8px 12px 10px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        user-select: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .popup-hdr {
        display: flex;
        justify-content: flex-end;
      }
      .close-x {
        width: 22px;
        height: 22px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        font-size: 18px;
        cursor: pointer;
        border-radius: 4px;
      }
      .close-x:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .dice-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .dice-btn {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 0 3px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .dice-btn:hover {
        background: var(--bg-strong);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }
      .dice-btn img {
        width: 26px;
        height: 26px;
      }
      .dice-btn .lbl {
        font-size: 9px;
        font-weight: 700;
        color: var(--text-dim);
        margin-top: 1px;
      }
      .dice-btn .badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 14px;
        height: 14px;
        background: var(--bad);
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        border-radius: 7px;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .dice-btn[data-count]:not([data-count="0"]) .badge {
        display: flex;
      }

      .expr-row {
        display: flex;
        gap: 5px;
      }
      .expr-input {
        flex: 1;
        height: 36px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--text);
        font-family: ui-monospace, monospace;
        font-size: 14px;
        font-weight: 700;
      }
      .expr-input:focus {
        border-color: var(--accent);
      }

      .expr-mod {
        display: flex;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-card);
        overflow: hidden;
      }
      .expr-mod button {
        width: 30px;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .expr-mod button:hover {
        background: rgba(93, 173, 226, 0.2);
      }

      .label-input {
        height: 28px;
        width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        text-align: center;
      }

      .actions {
        display: flex;
        gap: 5px;
        align-items: stretch;
      }
      .btn-act {
        flex: 1;
        height: 34px;
        background: var(--bg-strong);
        border: 1px solid var(--border-strong);
        color: var(--text);
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .btn-act.dis {
        color: var(--bad);
      }
      .btn-act.adv {
        color: var(--good);
      }
      .btn-act.crit {
        flex: 0 0 56px;
        color: var(--crit);
      }

      /* Dark row - solo per GM */
      .actions-dark {
        display: none;
        gap: 5px;
        align-items: stretch;
        margin-top: -2px;
      }
      .actions-dark.is-dm {
        display: flex;
      }
      .btn-dark-mini {
        flex: 1;
        height: 18px;
        background: rgba(187, 135, 221, 0.1);
        border: 1px solid rgba(187, 135, 221, 0.35);
        border-radius: 0 0 5px 5px;
        color: var(--dark);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .btn-dark-mini:hover {
        background: rgba(187, 135, 221, 0.22);
      }
    </style>
  </head>
  <body>
    <div class="popup">
      <div class="popup-hdr">
        <button class="close-x" id="closeBtn" type="button">×</button>
      </div>

      <div class="dice-row" id="diceRow">
        <!-- I tuoi 7 pulsanti dadi rimangono uguali -->
        <button class="dice-btn" data-type="d4">
          <img src="/suite/d4.png" alt="d4" /><span class="lbl">d4</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d6">
          <img src="/suite/d6.png" alt="d6" /><span class="lbl">d6</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d8">
          <img src="/suite/d8.png" alt="d8" /><span class="lbl">d8</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d10">
          <img src="/suite/d10.png" alt="d10" /><span class="lbl">d10</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d12">
          <img src="/suite/d12.png" alt="d12" /><span class="lbl">d12</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d20">
          <img src="/suite/d20.png" alt="d20" /><span class="lbl">d20</span
          ><span class="badge">0</span>
        </button>
        <button class="dice-btn" data-type="d100">
          <img src="/suite/d100.png" alt="d100" /><span class="lbl">d100</span
          ><span class="badge">0</span>
        </button>
        <span></span>
      </div>

      <div class="expr-row">
        <input
          class="expr-input"
          id="exprInput"
          type="text"
          placeholder="例如 2d6 + 1d20 + 5"
          spellcheck="false"
        />
        <div class="expr-mod">
          <button id="btnModDec" type="button">−</button>
          <button id="btnModInc" type="button">＋</button>
        </div>
      </div>

      <input
        class="label-input"
        id="labelInput"
        type="text"
        placeholder="备注（可选）"
      />

      <div class="actions">
        <button class="btn-act dis" data-act="dis" type="button">▼ 劣势</button>
        <button class="btn-act normal" data-act="roll" type="button">
          ⚀ 普通
        </button>
        <button class="btn-act adv" data-act="adv" type="button">▲ 优势</button>
        <button class="btn-act crit" data-act="crit" type="button">
          ✦ 重击
        </button>
      </div>

      <!-- RIGA DARK / SECRET -->
      <div class="actions-dark" id="darkActions">
        <button class="btn-dark-mini dis" data-act="dark-dis" type="button">
          ● 劣势
        </button>
        <button class="btn-dark-mini normal" data-act="dark-roll" type="button">
          ● 普通
        </button>
        <button class="btn-dark-mini adv" data-act="dark-adv" type="button">
          ● 优势
        </button>
        <button class="btn-dark-mini crit" data-act="dark-crit" type="button">
          ● 重击
        </button>
      </div>
    </div>

    <script type="module">
      import OBR from "@owlbear-rodeo/sdk";

      const MODAL_ID = "com.obr-suite/rollable-quick";
      const BC_QUICK_ROLL = "com.obr-suite/dice-quick-roll";

      let isGmQuick = false;

      // ==================== FIRE ROLL ====================
      async function fireRoll(opts = {}) {
        const expression = document.getElementById("exprInput").value.trim();
        const label = document.getElementById("labelInput").value.trim();
        if (!expression) return;

        const payload = {
          expression,
          label,
          itemId: null,
          focus: false,
          hidden: !!opts.hidden,
          rollerIsGM: isGmQuick,
          ...(opts.advMode && { advMode: opts.advMode }),
          ...(opts.critMode && { critMode: true }),
        };

        try {
          if (isGmQuick && opts.hidden) {
            // GM Dark Roll
            await OBR.broadcast.sendMessage(BC_QUICK_ROLL, payload, {
              destination: "LOCAL",
            });
          } else if (opts.hidden) {
            // Player Secret Roll
            await Promise.all([
              OBR.broadcast.sendMessage(BC_QUICK_ROLL, payload, {
                destination: "LOCAL",
              }),
              OBR.broadcast.sendMessage(BC_QUICK_ROLL, payload, {
                destination: "REMOTE",
              }),
            ]);
          } else {
            // Roll normale
            await OBR.broadcast.sendMessage(BC_QUICK_ROLL, payload, {
              destination: "REMOTE",
            });
          }
        } catch (e) {
          console.error("[quick-roll]", e);
        }

        await closeModal();
      }

      async function closeModal() {
        try {
          await OBR.modal.close(MODAL_ID);
        } catch {}
      }

      // ==================== INIT ====================
      OBR.onReady(async () => {
        try {
          const role = await OBR.player.getRole();
          isGmQuick = role === "GM";
        } catch {}

        if (isGmQuick) {
          document.getElementById("darkActions").classList.add("is-dm");
        }

        document.querySelectorAll("[data-act]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const act = btn.dataset.act;

            if (act === "roll") fireRoll({});
            else if (act === "adv") fireRoll({ advMode: "adv" });
            else if (act === "dis") fireRoll({ advMode: "dis" });
            else if (act === "crit") fireRoll({ critMode: true });
            else if (act === "dark-roll") fireRoll({ hidden: true });
            else if (act === "dark-adv")
              fireRoll({ hidden: true, advMode: "adv" });
            else if (act === "dark-dis")
              fireRoll({ hidden: true, advMode: "dis" });
            else if (act === "dark-crit")
              fireRoll({ hidden: true, critMode: true });
          });
        });

        document
          .getElementById("closeBtn")
          .addEventListener("click", closeModal);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
        });
      });
    </script>
  </body>
</html>
