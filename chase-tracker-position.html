<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Chase Position</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:#14182a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#e6e8ee;
}
.wrap{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
.title{font-size:13px;font-weight:700}
.subtitle{font-size:11px;color:#9aa0b3}
.row{display:flex;align-items:center;gap:8px}
.step{
  width:34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);
  color:#e6e8ee;font-size:18px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.step:hover{background:rgba(255,255,255,0.14)}
input[type=number]{
  flex:1;text-align:center;
  font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
  border-radius:8px;color:#e6e8ee;padding:8px 6px;
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.actions{margin-top:auto;display:flex;justify-content:flex-end;gap:8px}
button.action{
  font-size:12px;font-weight:600;border:none;border-radius:8px;
  padding:8px 14px;cursor:pointer;
}
.cancel{background:transparent;color:#9aa0b3}
.cancel:hover{color:#e6e8ee}
.save{background:#3498db;color:#fff}
.save:hover{background:#4aa8e8}
</style>
</head>
<body>
<div class="wrap">
  <div class="title" id="title">Change Chase position</div>
  <div class="subtitle" id="subtitle">Distance travelled so far:</div>
  <div class="row">
    <button class="step" id="dec">−</button>
    <input type="number" id="distance" step="1" min="0">
    <button class="step" id="inc">+</button>
  </div>
  <div class="actions">
    <button class="action cancel" id="cancel">Cancel</button>
    <button class="action save" id="save">Save</button>
  </div>
</div>
<script type="module" src="/src/chase-tracker-position-page.ts"></script>
</body>
</html>
