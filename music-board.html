<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>音乐板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c14; --bg-1:#11141d; --bg-2:#181c27; --bg-3:#1f2433;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.16);
  --text:#eaeef5; --text-2:#adb3c1; --text-3:#6e7588;
  --accent:#4ad6c7; --accent-2:#5cf0de;
  --bgm-color:#4ad6c7; --sfx-color:#c184ff;
  --green:#5cd97c; --red:#ff6b6b; --yellow:#ffd66b;
}
html,body{
  margin:0;height:100%;background:transparent;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;
}
.app{
  padding:14px 14px 14px 28px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;
  background:radial-gradient(circle at 10% 0%, rgba(74,214,199,0.05), transparent 50%), var(--bg);
  border-radius:10px;
  min-height:100%;
  position:relative;
}

/* === Full-mode drag-grip — left edge, styled as the side panel of a
   vintage hi-fi component (dark wood plinth + chrome knob + speaker-
   grille vent slats). Sits on the popover's left edge; the popover is
   right-anchored so the grip faces the canvas interior. Pointer-down
   here triggers panel drag; the wood grain + chrome tell the user
   "this is the chassis, you can pick it up by it". === */
.music-drag-grip{
  position:absolute;
  top:8px;left:-2px;
  width:26px;height:104px;
  /* Wood grain background — repeating faint stripes overlaid on a
     warm dark plinth gradient. */
  background:
    repeating-linear-gradient(180deg,
      rgba(255,200,150,0.045) 0px,rgba(255,200,150,0.045) 1px,
      transparent 1px,transparent 5px),
    linear-gradient(90deg,
      #14100a 0%,#2d2014 22%,#3a2818 52%,#2d2014 78%,#14100a 100%);
  border:1px solid #0a0604;
  border-radius:7px 0 0 7px;
  /* Inset highlights = chrome trim; drop shadow = lifted chassis */
  box-shadow:
    inset 0 1px 0 rgba(255,200,150,0.22),
    inset 1px 0 0 rgba(255,200,150,0.14),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 3px 9px rgba(0,0,0,0.55);
  cursor:grab;
  touch-action:none;user-select:none;
  z-index:2;
  transition:filter .12s;
}
.music-drag-grip:hover{filter:brightness(1.22)}
.music-drag-grip.is-dragging{cursor:grabbing;filter:brightness(1.35) saturate(1.1)}
/* Chrome knob/dial near the top — "tone control" looking element */
.music-drag-grip::before{
  content:'';position:absolute;
  top:10px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,#f5f8fc 0%,#a8b3c4 55%,#404a55 100%);
  box-shadow:
    inset 0 -1px 2px rgba(0,0,0,0.55),
    0 1px 2px rgba(0,0,0,0.5);
  pointer-events:none;
}
/* Vent slats — looks like the speaker grille on a hi-fi side panel */
.music-drag-grip::after{
  content:'';position:absolute;
  top:38px;left:50%;transform:translateX(-50%);
  width:14px;height:54px;
  background:repeating-linear-gradient(180deg,
    rgba(0,0,0,0.55) 0px,rgba(0,0,0,0.55) 2px,
    transparent 2px,transparent 6px);
  border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(255,200,150,0.07);
  pointer-events:none;
}
.music-drag-grip svg{display:none}
/* Hide full-mode grip when minimized — the mini-case (wrapping the
   vinyl button) below serves as the drag handle in mini mode. */
.app.minimized .music-drag-grip{display:none}

/* === minimize header === */
.header-row{display:flex;align-items:center;gap:8px}
.header-title{flex:1;font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:0.3px}
.icon-btn{
  width:26px;height:26px;
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:5px;
  color:var(--text-3);
  font-size:14px;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--bg-3);color:var(--text);border-color:var(--line-2)}

/* === Minimized state — turntable plinth (drag handle) wrapping the
   tiny vinyl button (click-to-expand) === */
.app.minimized{padding:0;min-height:auto;gap:0;background:transparent;position:relative}
.app.minimized > *:not(.music-mini-case):not(.toast-stack){display:none}
.app:not(.minimized) .music-mini-case{display:none}

/* The plinth/case — a small "turntable from above" with wood grain,
   chrome trim, and a stubby tonearm sticking out top-right. The whole
   plinth is the drag target; the vinyl inside is click-to-expand
   (vinyl's pointerdown stopPropagation prevents drag-on-vinyl). */
.music-mini-case{
  position:relative;
  width:72px;height:64px;
  margin:6px;
  background:
    /* Wood grain stripes */
    repeating-linear-gradient(90deg,
      rgba(255,200,150,0.045) 0px,rgba(255,200,150,0.045) 1px,
      transparent 1px,transparent 4px),
    /* Plinth gradient — warmer in the center, darker on edges */
    linear-gradient(135deg,#3a2818 0%,#2a1d12 50%,#1c1308 100%);
  border:1px solid #0a0604;
  border-radius:9px;
  /* Chrome bezel + chassis drop shadow */
  box-shadow:
    inset 0 1px 0 rgba(255,200,150,0.22),
    inset 1px 0 0 rgba(255,200,150,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.6),
    inset -1px 0 0 rgba(0,0,0,0.5),
    0 3px 10px rgba(0,0,0,0.6);
  cursor:grab;
  touch-action:none;user-select:none;
  display:flex;align-items:center;justify-content:center;
  transition:filter .12s;
}
.music-mini-case:hover{filter:brightness(1.18)}
.music-mini-case.is-dragging{cursor:grabbing;filter:brightness(1.35)}

/* Tonearm — angled chrome arm in top-right, decorative drag affordance. */
.music-mini-case::before{
  content:'';position:absolute;
  top:9px;right:5px;
  width:24px;height:3px;
  background:linear-gradient(180deg,#e8eef5 0%,#a8b3c4 55%,#5a6470 100%);
  border-radius:2px;
  transform-origin:right center;
  transform:rotate(-26deg);
  box-shadow:
    0 1px 2px rgba(0,0,0,0.7),
    inset 0 -1px 0 rgba(0,0,0,0.35);
  pointer-events:none;
  z-index:1;
}
/* Tonearm pivot — round chrome stud at the hinge */
.music-mini-case::after{
  content:'';position:absolute;
  top:5px;right:3px;
  width:8px;height:8px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,#f5f8fc 0%,#a8b3c4 60%,#404a55 100%);
  box-shadow:
    inset 0 -1px 1px rgba(0,0,0,0.5),
    0 1px 2px rgba(0,0,0,0.6);
  pointer-events:none;
  z-index:2;
}

/* Vinyl button — sits inside the plinth, click-to-expand. z-index 1
   to stay below the tonearm visually but still receive pointer events
   (case bg is z-auto/0 so vinyl=1 is enough). */
.mini-bar{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;
  background:var(--bg-2);
  border:1px solid var(--line-2);
  border-radius:50%;
  cursor:pointer;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.5),
    inset 0 0 0 1px rgba(255,200,150,0.08);
  position:relative;
  margin:0;
  z-index:1;
}
.mini-bar:hover{background:var(--bg-3);border-color:var(--accent)}
.mini-bar .mini-vinyl{
  width:22px;height:22px;border-radius:50%;
  background:repeating-radial-gradient(circle,#1a1a1a 0px,#0a0a0a 1px,#0e0e0e 2px),
             radial-gradient(circle,#2a2a2a 0%,#0a0a0a 70%);
  position:relative;
  box-shadow:inset 0 0 4px rgba(0,0,0,0.8);
}
.mini-bar .mini-vinyl::after{
  content:'';position:absolute;inset:30%;border-radius:50%;
  background:radial-gradient(circle,var(--bgm-color),#1f5e57);
}
.mini-bar.playing .mini-vinyl{animation:spin 3.2s linear infinite}
.mini-bar .mini-dot{
  position:absolute;top:3px;right:3px;
  width:6px;height:6px;border-radius:50%;
  background:var(--text-3);
}
.mini-bar.playing .mini-dot{
  background:var(--accent);
  box-shadow:0 0 4px var(--accent);
  animation:pulse 1.5s ease-in-out infinite;
}
.mini-title,.mini-expand{display:none}

/* Player role: hide the close-style minimize button (players can
   still minimize via maximize/restore cycle if they want — but they
   can't close the iframe, only DM can via cluster-row toggle). */
.app.role-player .header-row .icon-btn{
  /* Keep the minimize button visible — players are allowed to
     minimize. We just need to remind them they can't actually close
     the music board. */
}
.app.role-player .pair-section{display:none}
.app.role-player .vol-section{margin-top:0}

/* === now playing card === */
.np-card{
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
  padding:14px;
  background:linear-gradient(135deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--line);
  border-radius:12px;
  position:relative;overflow:hidden;
}
.np-card.playing{border-color:rgba(74,214,199,0.40)}
.np-card.playing::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 15% 50%,rgba(74,214,199,0.12),transparent 60%);
  pointer-events:none;
}
.np-vinyl{
  width:80px;height:80px;border-radius:50%;
  position:relative;flex-shrink:0;
  background:
    repeating-radial-gradient(circle,#1a1a1a 0px,#0a0a0a 1.3px,#0e0e0e 2.6px),
    radial-gradient(circle at 35% 35%,#2a2a2a 0%,#0a0a0a 70%);
  box-shadow:inset 0 0 12px rgba(0,0,0,0.85),0 3px 8px rgba(0,0,0,0.5);
}
.np-vinyl::before{
  content:'';position:absolute;inset:30%;border-radius:50%;
  background:radial-gradient(circle,var(--bgm-color) 0%,#1f5e57 100%);
}
.np-vinyl::after{
  content:'';position:absolute;top:50%;left:50%;
  width:4px;height:4px;margin:-2px 0 0 -2px;
  background:#000;border-radius:50%;z-index:2;
}
.np-card.playing .np-vinyl{animation:spin 3.2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.np-info{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:1}
.np-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.np-status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.np-card.playing .np-status .dot{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.np-title{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-time{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-3)}

/* === volumes === */
.vol-section{
  padding:12px 14px;
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:10px;
  display:flex;flex-direction:column;gap:10px;
}
.vol-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
.vol-row .lbl{flex-shrink:0;width:44px;display:flex;align-items:center;gap:5px}
.vol-row .lbl .badge{padding:1px 6px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:0.6px}
.badge--bgm{background:rgba(74,214,199,0.15);color:var(--bgm-color)}
.badge--sfx{background:rgba(193,132,255,0.15);color:var(--sfx-color)}
.vol-slider{
  flex:1;appearance:none;-webkit-appearance:none;
  height:4px;background:var(--bg-3);border-radius:999px;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;background:var(--accent);
  border-radius:50%;cursor:pointer;
}
.vol-slider::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;border:none;cursor:pointer}
.vol-readout{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-3);min-width:30px;text-align:right}
.mute-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none}
.mute-row input{accent-color:var(--accent)}

/* === pair === */
.pair-section{
  padding:12px 14px;
  background:var(--bg-1);
  border:1px solid var(--line);
  border-radius:10px;
}
.pair-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;
}
.pair-title{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:0.3px}
.pair-status{
  font-size:10.5px;padding:2px 7px;border-radius:999px;
  background:var(--bg-3);color:var(--text-3);font-weight:600;letter-spacing:0.5px;
}
.pair-status.live{background:rgba(92,217,124,0.15);color:var(--green)}
.pair-status.connecting{background:rgba(255,214,107,0.15);color:var(--yellow)}
.pair-status.error{background:rgba(255,107,107,0.15);color:var(--red)}
.pair-controls{display:flex;align-items:center;gap:8px}
.pair-code{
  flex:1;padding:7px 10px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:6px;
  color:var(--text);font-family:ui-monospace,monospace;font-size:13px;
  letter-spacing:2px;text-align:center;text-transform:uppercase;
}
.pair-code:focus{outline:none;border-color:var(--accent)}
.btn{
  padding:7px 13px;background:var(--bg-3);color:var(--text);
  border:1px solid var(--line-2);border-radius:6px;
  font-size:12px;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--bg-2);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn--primary{
  background:linear-gradient(180deg,var(--accent-2),var(--accent));
  color:#062018;border-color:var(--accent);font-weight:600;
}
.btn--primary:hover:not(:disabled){background:linear-gradient(180deg,#74ffea,var(--accent-2))}
.pair-hint{margin-top:8px;font-size:11px;color:var(--text-3);line-height:1.6}
.pair-hint code{background:var(--bg-2);padding:1px 5px;border-radius:3px;color:var(--accent);font-family:ui-monospace,monospace;font-size:10.5px}
.pair-hint a{color:var(--accent);text-decoration:none}
.pair-hint a:hover{text-decoration:underline}

/* === toast === */
.toast-stack{position:fixed;bottom:14px;right:14px;z-index:50;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{padding:7px 12px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:6px;font-size:11.5px;animation:t-in .2s ease-out}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.warn{border-color:var(--yellow);color:var(--yellow)}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes t-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">

  <!-- Drag grip (full mode) — pinned to left edge, styled as a hi-fi
       component side panel (wood + chrome + vent slats). The chrome
       knob and vent slats are purely decorative; pointer-down anywhere
       on the strip triggers the panel drag. -->
  <div class="music-drag-grip" id="musicDragHandle" title="拖动音乐板" data-i18n-title="mbDragExpand"></div>

  <!-- Header with minimize button -->
  <div class="header-row">
    <span class="header-title" data-i18n="mbTitle">音乐板</span>
    <button class="icon-btn" id="minimizeBtn" title="收起到小条，保留音乐和配对" data-i18n-title="mbMinimize">−</button>
  </div>

  <!-- Mini mode — turntable plinth (drag handle) wrapping the vinyl
       button (click-to-expand). Shown only when .app.minimized.
       The plinth is the drag target; the vinyl inside stops pointerdown
       propagation so a click on the disc expands without dragging. -->
  <div class="music-mini-case" id="musicDragHandleMini" title="拖动音乐板，点击唱片展开" data-i18n-title="mbDragExpand">
    <div class="mini-bar" id="miniBar" title="点击唱片展开音乐板" data-i18n-title="mbDiscExpand">
      <div class="mini-vinyl"></div>
      <div class="mini-dot"></div>
      <span class="mini-title" id="miniTitle"></span>
      <button class="mini-expand" id="miniExpand"></button>
    </div>
  </div>

  <!-- Now playing -->
  <div class="np-card" id="npCard">
    <div class="np-vinyl"></div>
    <div class="np-info">
      <div class="np-status">
        <span class="dot"></span>
        <span id="npStatus" data-i18n="mbStatusIdle">空闲</span>
      </div>
      <div class="np-title" id="npTitle" data-i18n="mbNoBgm">没有 BGM 在播放</div>
      <div class="np-time" id="npTime">--:-- / --:--</div>
    </div>
  </div>

  <!-- Volumes -->
  <div class="vol-section">
    <div class="vol-row">
      <div class="lbl"><span class="badge badge--bgm">BGM</span></div>
      <input type="range" class="vol-slider" id="bgmVol" min="0" max="100" value="80">
      <span class="vol-readout" id="bgmVolReadout">80</span>
    </div>
    <div class="vol-row">
      <div class="lbl"><span class="badge badge--sfx">SFX</span></div>
      <input type="range" class="vol-slider" id="sfxVol" min="0" max="100" value="100">
      <span class="vol-readout" id="sfxVolReadout">100</span>
    </div>
    <label class="mute-row">
      <input type="checkbox" id="muteChk">
      <span data-i18n="mbMuteSelf">静音（仅自己）</span>
    </label>
  </div>

  <!-- Pair -->
  <div class="pair-section">
    <div class="pair-head">
      <span class="pair-title" data-i18n="mbPairTitle">接入网页音乐板</span>
      <span class="pair-status" id="pairStatus" data-i18n="mbStNotConnected">未连接</span>
    </div>
    <div class="pair-controls">
      <input type="text" class="pair-code" id="pairCode" placeholder="网页那边的 6 位配对码" data-i18n-placeholder="mbPairCodePh" maxlength="9">
      <button class="btn btn--primary" id="pairBtn" data-i18n="mbConnect">连接</button>
      <button class="btn" id="unpairBtn" style="display:none" data-i18n="mbDisconnect">断开</button>
    </div>
    <div class="pair-hint" id="pairHint" data-i18n-html="mbPairHint">
      在 <a href="https://obr-suite-custom.pages.dev/studio/music-studio/" target="_blank">obr-suite-custom.pages.dev/studio/music-studio/</a> 点「配对枭熊」拿到配对码，粘到这里。<br>
      连接后网页里的所有播放/暂停操作会同步到 OBR scene metadata，所有<b>已打开本面板</b>的玩家都能听见同样的音乐。<br>
      <b>提示</b>：关闭此弹窗会停止音乐 + 断开配对。要保留请点右上角「−」收起到小条。
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="./src/music-board-page.ts"></script>
</body>
</html>
