<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Token name</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:transparent;user-select:none}
/* Invisible hit area over the name tab drawn on the map. */
#hit{position:absolute;inset:0;cursor:text}
#field{
  position:absolute;inset:0;display:none;width:100%;height:100%;
  border:none;outline:2px solid rgba(255,255,255,0.75);outline-offset:-2px;border-radius:4px;
  padding:0 6px;text-align:center;font-family:Roboto,-apple-system,"Segoe UI",sans-serif;font-weight:500;
}
body.editing #hit{display:none}
body.editing #field{display:block}
</style>
</head>
<body>
<div id="hit"></div>
<input id="field" type="text" maxlength="60" spellcheck="false" autocomplete="off">
<script type="module" src="/src/name-edit-page.ts"></script>
</body>
</html>
