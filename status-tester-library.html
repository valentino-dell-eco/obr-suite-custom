<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Status Tester library</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#141a2c;color:#e6e8ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}
.wrap{display:flex;flex-direction:column;height:100%}
header{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
header .title{flex:1;font-weight:800;font-size:14px}
.x{flex:none;width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:#9aa0b3;cursor:pointer;font-size:14px;font-weight:800}
.x:hover{background:rgba(255,255,255,.1);color:#fff}
.notice{flex:none;margin:10px 14px 0;padding:8px 10px;border-radius:8px;background:rgba(245,200,118,.14);color:#f5c876;font-size:12px}
.warn{flex:none;margin:10px 14px 0;padding:8px 10px;border-radius:8px;background:rgba(231,76,60,.16);color:#ffb3a8;font-size:12px}
.toolbar{flex:none;display:flex;gap:8px;padding:10px 14px 4px}
input.text{flex:1;min-width:0;font-size:12.5px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);color:#e6e8ee;outline:none}
input.text:focus{border-color:#5dade2}
.list{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 12px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:6px}
.spacer{flex:1}
.empty{color:#7d8494;font-size:12px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-weight:700;
  max-width:280px;white-space:nowrap;overflow:hidden;border:1px solid rgba(0,0,0,.3)}
.chip img{width:16px;height:16px;flex:none}
.chip .emoji{font-size:15px;line-height:1;flex:none}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.chip .t b{ font-weight:700; }
.chip .t .lv{ font-style:italic; font-weight:400; }
.att-badge{font-size:10px;font-weight:800;color:#8fd3ff;background:rgba(93,173,226,.16);border-radius:999px;padding:2px 7px}
.btn{flex:none;font-size:12px;font-weight:700;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;background:#3498db;color:#fff}
.btn:hover{background:#4aa8e8}
.btn.sec{background:rgba(255,255,255,.08);color:#c5cad8}
.btn.sec:hover{background:rgba(255,255,255,.16)}
.btn.small{padding:5px 10px;font-size:11.5px}
.btn.danger{background:rgba(231,76,60,.25);color:#ffb3a8}
.btn.danger:hover,.btn.danger.confirm{background:#e74c3c;color:#fff}
.form{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.form[hidden],.list[hidden],.toolbar[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#8a90a3}
.colors{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.colors input[type=color]{width:34px;height:28px;border:none;background:none;cursor:pointer;padding:0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #3498db}
.icons{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.ic{height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700}
.ic img{width:20px;height:20px;pointer-events:none}
.ic.sel{border-color:#fff;box-shadow:0 0 0 2px #3498db}
.ic.disabled{opacity:.35}
.att{display:flex;gap:10px;align-items:flex-start}
.att .pv{flex:none;width:84px;height:84px;border-radius:10px;background:repeating-conic-gradient(#2a3150 0 25%,#1e2440 0 50%) 0 0/16px 16px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7d8494;font-size:11px;text-align:center}
.att .pv img,.att .pv video{max-width:100%;max-height:100%}
.att .ctl{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.att .ctl .row{flex-wrap:nowrap}
.err{color:#ff8b7a;font-size:12px}
label.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#e6e8ee;cursor:pointer;text-transform:none;letter-spacing:0}
.hint{font-size:11.5px;color:#8a90a3}
.chk.sub,.hint.sub{margin-left:22px}
label.chk.sub{margin-top:6px;font-weight:600}
.preview{display:flex;align-items:center;gap:8px;padding:6px 0}
.actions{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="title" id="title"></span>
    <button class="x" id="close" type="button">✕</button>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="warn" id="warn" hidden></div>
  <div class="toolbar" id="toolbar">
    <input class="text" id="search" type="text" maxlength="40" autocomplete="off">
    <button class="btn" id="presetBtn" type="button"></button>
    <button class="btn" id="newBtn" type="button"></button>
  </div>
  <div class="list" id="list"></div>
  <div class="form" id="form" hidden>
    <div class="preview" id="preview"></div>
    <div class="field">
      <label id="lblTitle" for="fTitle"></label>
      <input class="text" id="fTitle" type="text" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <label id="lblColor"></label>
      <div class="colors" id="colors"><input type="color" id="fColor"></div>
    </div>
    <div class="field">
      <label id="lblIcon"></label>
      <div class="icons" id="icons"></div>
    </div>
    <div class="field">
      <label id="lblEmoji" for="fEmoji"></label>
      <input class="text" id="fEmoji" type="text" maxlength="16" autocomplete="off" placeholder="😵">
    </div>
    <div class="field">
      <label class="chk"><input type="checkbox" id="fLevels"><span id="lblLevels"></span></label>
      <div class="hint" id="hintLevels"></div>
      <label class="chk sub" id="rowLevelGrid"><input type="checkbox" id="fLevelGrid"><span id="lblLevelGrid"></span></label>
      <div class="hint sub" id="hintLevelGrid"></div>
    </div>
    <div class="field">
      <label id="lblAtt"></label>
      <div class="att">
        <div class="pv" id="attPreview"></div>
        <div class="ctl">
          <div class="row">
            <button class="btn sec small" id="pickAsset" type="button"></button>
            <button class="btn danger small" id="removeAtt" type="button"></button>
          </div>
          <div class="row">
            <input class="text" id="attUrl" type="url" maxlength="1024" autocomplete="off">
            <button class="btn sec small" id="useUrl" type="button"></button>
          </div>
          <div class="err" id="attErr" hidden></div>
        </div>
      </div>
    </div>
    <div class="err" id="formErr" hidden></div>
    <div class="actions">
      <button class="btn sec" id="cancelBtn" type="button"></button>
      <button class="btn" id="saveBtn" type="button"></button>
    </div>
  </div>
</div>
<script type="module" src="/src/status-tester-library-page.ts"></script>
</body>
</html>
